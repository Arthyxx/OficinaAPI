<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente e Carro - Oficina</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="px-3">

<hr>

<div class="row align-items-center">
    <div class="col">
        <span class="fs-2">Oficina</span>
    </div>

    <div class="col">
        <nav class="text-end">
            <a class="btn btn-outline-dark" href="/dashboard">
                <i class="material-icons">home</i> Dashboard
            </a>

            <a class="btn btn-outline-dark" href="/cadastro">
                <i class="material-icons">directions_car</i> Produtos
            </a>

            <a class="btn btn-outline-danger" href="/login">
                <i class="material-icons">logout</i> Sair
            </a>
        </nav>
    </div>
</div>

<hr>

<section class="card card-body mb-4">
    <h3>➕ Cadastrar Novo Cliente</h3>

    <form id="formCliente">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nome completo</label>
                <input type="text" id="nomeCliente" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Telefone</label>
                <input type="text" id="telefoneCliente" class="form-control" placeholder="85999999999" required>
                <small class="text-muted">Digite apenas números, com DDD.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" id="senhaCliente" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select id="tipoCliente" class="form-select" required>
                <option value="CLIENTE" selected>Cliente</option>
                <option value="MECANICO">Mecânico</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            <i class="material-icons">person_add</i> Cadastrar Cliente
        </button>
    </form>

    <div id="msgCliente" class="mt-2"></div>
</section>

<section class="card card-body">
    <h3>🚗 Cadastrar Carro</h3>

    <form id="formCarro">
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Modelo</label>
                <input type="text" id="modeloCarro" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Marca</label>
                <input type="text" id="marcaCarro" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Ano</label>
                <input type="number" id="anoCarro" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Problema relatado</label>
            <textarea id="problemaCarro" class="form-control" rows="2" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select id="usuarioId" class="form-select" required>
                <option value="">Carregando clientes...</option>
            </select>
            <small class="text-muted">
                Selecione o cliente que será vinculado a este carro.
            </small>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="material-icons">directions_car</i> Cadastrar Carro
        </button>
    </form>

    <div id="msgCarro" class="mt-2"></div>
</section>

<hr>

<h4>📋 Clientes já cadastrados</h4>

<div class="table-responsive">
    <table class="table table-sm table-bordered" id="tabelaClientes">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
        </tr>
        </thead>

        <tbody id="listaClientes">
        <tr>
            <td colspan="3">Carregando...</td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="rodape mt-4 text-center text-muted">
    <div id="dataHora"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/cadastro.js"></script>

</body>
</html>
