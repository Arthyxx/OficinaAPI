<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Oficina</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="px-3">

<hr>

<div class="row align-items-center">
    <div class="col">
        <span class="fs-2">Oficina</span>
    </div>

    <div class="col">
        <nav class="text-end">
            <a class="btn btn-outline-dark" href="/dashboard">
                <i class="material-icons">home</i> Dashboard
            </a>

            <a class="btn btn-outline-dark" href="/cadastro">
                <i class="material-icons">directions_car</i> Produtos
            </a>

            <a class="btn btn-outline-danger" href="/login">
                <i class="material-icons">logout</i> Sair
            </a>
        </nav>
    </div>
</div>

<hr>

<section class="card card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📋 Veículos na Oficina</h3>

        <a class="btn btn-primary" href="/cadastro">
            <i class="material-icons">add</i> Novo Carro + Cliente
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover" id="tabelaCarros">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Modelo</th>
                <th>Marca</th>
                <th>Ano</th>
                <th>Problema relatado</th>
                <th>Status</th>
                <th>Cliente</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="listaCarros">
            <tr>
                <td colspan="8" class="text-center">Carregando...</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<!-- MODAL EDITAR CARRO -->
<div class="modal fade" id="modalEditarCarro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="formEditarCarro">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Carro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="editCarroId">

                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" id="editModeloCarro" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" id="editMarcaCarro" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ano</label>
                        <input type="number" id="editAnoCarro" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Problema relatado</label>
                        <textarea id="editProblemaCarro" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="editStatusCarro" class="form-select" required>
                            <option value="PENDENTE">Pendente</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <select id="editUsuarioId" class="form-select" required>
                            <option value="">Carregando clientes...</option>
                        </select>
                        <small class="text-muted">
                            Selecione o cliente correto para este carro.
                        </small>
                    </div>

                    <div id="msgEditarCarro"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Salvar alterações
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<footer class="rodape mt-4 text-center text-muted">
    <div id="dataHora"></div>
    <small>Oficina Mecânica - Sistema de gestão</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/dashboard.js"></script>

</body>
</html>
