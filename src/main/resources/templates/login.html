<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oficina</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row mt-5">
        <div class="col-12 col-md-6 offset-md-3">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        <i class="material-icons fs-1">garage</i><br>
                        Oficina Mecânica
                    </h2>
                    <hr>
                    <form action="/dashboard" method="get">
                        <div class="mb-3">
                            <label class="form-label">E-mail ou Nome de usuário</label>
                            <input type="text" class="form-control form-control-lg" placeholder="Digite seu email/nome">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control form-control-lg" placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="material-icons">login</i> Entrar
                        </button>
                    </form>
                    <div class="mt-3 text-center text-muted small">
                        Login apenas ilustrativo. Acesse diretamente o <a href="/dashboard">Dashboard</a>.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="rodape mt-5 text-center text-muted">
    <div id="dataHora"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function atualizarDataHora() {
        const agora = new Date();
        const div = document.getElementById('dataHora');
        if (div) div.innerHTML = `<i class="material-icons fs-6">schedule</i> ${agora.toLocaleString('pt-BR')}`;
    }
    atualizarDataHora();
    setInterval(atualizarDataHora, 1000);
</script>
</body>
</html>
