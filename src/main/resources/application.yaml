spring:
  application:
    name: OficinaAPI
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL}                      # ← remova a chave extra
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL:update}
    show-sql: false
    open-in-view: false
    database-platform: ${DB_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
logging:
  level:
    OficinaAPI: DEBUG
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    use-root-path: true